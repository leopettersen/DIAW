<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estações de Rádio em BH</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<aside>
    <div class="nav" onClick="window.location.href='/'">
        <i data-lucide="house"></i>
        <a class="aNav">Home</a></div>
    <div class="nav" onClick="window.location.href='/favorites'">
        <i data-lucide="heart"></i>
        <a class="aNav">Favoritos</a></div>
</aside>
<div class="container">
    <h1>Estações de rádio em Belo Horizonte</h1>
    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Favicon</th>
            <th>Nome</th>
            <th>Favorito</th>
            <th>Player</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="station, iterStat : ${stations}"
            th:data-station-id="${station.stationuuid}"
            th:data-name="${station.name}"
            th:data-favicon="${station.favicon}"
            th:data-url="${station.url}">
            <td th:text="${iterStat.index + 1}"></td>
            <td>
                <img class="favicon"
                     th:src="${station.favicon}"
                     th:alt="Favicon"/>
            </td>
            <td class="break-word">
                <a th:href="${station.homepage}" th:text="${station.name}"></a>
            </td>
            <td>
                <button class="favorite-btn" data-favorite-button>
                    <i data-lucide="heart"></i>
                </button>
            </td>
            <td>
                <div class="audio-container">
                    <button class="play-btn" data-player-button>
                        <i data-lucide="play"></i>
                    </button>
                    <audio data-player-audio th:src="${station.url}" preload="none"></audio>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://unpkg.com/lucide@1.47.0/dist/umd/lucide.min.js"></script>
<script th:src="@{/js/radio.js}"></script>
<script>
    const favSet = new Set();

    async function loadFavorites() {
        try {
            const res = await fetch(`/api/favorites?clientId=${getClientId()}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const favorites = await res.json();
            favorites.forEach(f => favSet.add(f.stationuuid));
            document.querySelectorAll('[data-favorite-button]').forEach(btn => {
                if (favSet.has(btn.closest('tr').dataset.stationId)) {
                    btn.classList.add('is-favorite');
                }
            });
        } catch (err) {
            console.error('Falha ao carregar favoritos:', err);
        }
    }

    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-favorite-button]');
        if (!btn) return;

        const tr = btn.closest('tr');
        const id = tr.dataset.stationId;
        if (!id) return;

        const isFav = favSet.has(id);
        try {
            let res;
            if (isFav) {
                res = await fetch(`/api/favorites?clientId=${getClientId()}&stationuuid=${encodeURIComponent(id)}`, { method: 'DELETE' });
            } else {
                res = await fetch('/api/favorites', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        clienteId: getClientId(),
                        stationuuid: id,
                        name: tr.dataset.name,
                        favicon: tr.dataset.favicon,
                        url: tr.dataset.url
                    })
                });
            }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            if (isFav) {
                favSet.delete(id);
                btn.classList.remove('is-favorite');
            } else {
                favSet.add(id);
                btn.classList.add('is-favorite');
            }
        } catch (err) {
            console.error('Falha ao alterar favorito:', err);
        }
    });

    loadFavorites();
</script>
</body>
</html>
